<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media & jobs</title>
<link rel="stylesheet" href="../styles.css">
<link rel="icon" href="../assets/logo.svg">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head>
<body>
<style>
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px; }
  .block { padding: 18px 0; border-bottom: 1px solid var(--line-soft); }
  .block:last-child { border-bottom: none; }
</style>
<div class="wrap">
  <p class="eyebrow">theogalh.dev · components</p>
  <h1 class="display">Media &amp; jobs</h1>
  <p class="sub">Uploads, lecture et logs : les organes de ytp et screen.</p>
  <hr class="hairline" />
  <div class="block">
    <h2 class="section-title">Upload progress</h2>
    <div id="up-demo" style="max-width:520px"></div>
  </div>
  <div class="block">
    <h2 class="section-title">Player bar</h2>
    <div id="player-demo" style="max-width:560px"></div>
  </div>
  <div class="block">
    <h2 class="section-title">Log viewer</h2>
    <div id="log-demo" style="max-width:680px"></div>
  </div>
</div>
<script>
(function mount(tries) {
  var DS = window.TheogalhDevDesignSystem_32f2b5;
  if (!DS || !DS.UploadProgress || !DS.PlayerBar || !DS.LogViewer) { if ((tries || 0) < 20) setTimeout(function () { mount((tries || 0) + 1); }, 150); return; }
  var e = React.createElement;
  ReactDOM.createRoot(document.getElementById('up-demo')).render(e(DS.UploadProgress, { items: [
    { name: 'concert-4k.mp4', progress: 62, speed: '18 MB/s', size: '1.2 GB', status: 'uploading' },
    { name: 'screenshot-2026-08-06.png', status: 'done', size: '2.4 MB' },
    { name: 'raw-footage.mov', status: 'error', message: 'file exceeds 2 GB' }
  ], onCancel: function () {} }));
  ReactDOM.createRoot(document.getElementById('player-demo')).render(e(DS.PlayerBar, { duration: 754, position: 312, playing: true, rate: 1.5 }));
  ReactDOM.createRoot(document.getElementById('log-demo')).render(e(DS.LogViewer, { title: 'ytp · job an_8f2c', autoscroll: false, lines: [
    { time: '18:42:01', level: 'info', message: 'job queued (priority: normal)' },
    { time: '18:42:03', level: 'info', message: 'fetching metadata for youtube.com/watch?v=dQw4' },
    { time: '18:42:09', level: 'ok', message: 'metadata resolved — 12:34, 1080p, h264' },
    { time: '18:42:10', level: 'info', message: 'download started (4 segments)' },
    { time: '18:43:22', level: 'warn', message: 'segment 3 retried (timeout after 30s)' },
    { time: '18:44:51', level: 'ok', message: 'download complete — 148 MB' },
    { time: '18:44:52', level: 'err', message: 'thumbnail extraction failed: ffmpeg exit 1' },
    { time: '18:44:53', level: 'info', message: 'falling back to frame at 00:10' }
  ] }));
})(0);
</script>
</body>
</html>
