<!doctype html>
<!-- @dsCard group="Brand" name="Charts" subtitle="Barres, donut, sparkline — la data reste sobre" viewport="940x820" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charts</title>
<link rel="stylesheet" href="../styles.css">
<link rel="icon" href="../assets/logo.svg">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head>
<body>
<style>
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px; }
  .block { padding: 18px 0; border-bottom: 1px solid var(--line-soft); }
  .block:last-child { border-bottom: none; }
</style>
<div class="wrap">
  <p class="eyebrow">theogalh.dev · components</p>
  <h1 class="display">Charts</h1>
  <p class="sub">Périwinkle pour la mesure principale, signaux pour les catégories. Jamais plus de 5 séries.</p>
  <hr class="hairline" />
  <div class="block">
    <h2 class="section-title">Bar chart — requêtes par app</h2>
    <div id="bars-demo" class="panel" style="max-width:520px"></div>
  </div>
  <div class="block">
    <h2 class="section-title">Donut — stockage par type</h2>
    <div id="donut-demo" class="panel" style="max-width:520px"></div>
  </div>
  <div class="block">
    <h2 class="section-title">Sparkline — tendance dans une stat card</h2>
    <div class="stats-grid" style="max-width:420px">
      <div class="stat-card"><span class="stat-label">Requests / day</span><span class="stat-value">12,480</span><span id="spark-demo"></span></div>
    </div>
  </div>
</div>
<script>
(function mount(tries) {
  var DS = window.TheogalhDevDesignSystem_32f2b5;
  if (!DS || !DS.BarChart || !DS.Donut) { if ((tries || 0) < 20) setTimeout(function () { mount((tries || 0) + 1); }, 150); return; }
  var e = React.createElement;
  ReactDOM.createRoot(document.getElementById('bars-demo')).render(e(DS.BarChart, { data: [
    { label: 'ytp', value: 8420 }, { label: 'screen', value: 2960 }, { label: 'vote-lois', value: 780 }, { label: 'api direct', value: 320 }
  ] }));
  ReactDOM.createRoot(document.getElementById('donut-demo')).render(e(DS.Donut, { data: [
    { label: 'Video', value: 148 }, { label: 'Images', value: 42 }, { label: 'Audio', value: 16 }, { label: 'Other', value: 8 }
  ] }));
  ReactDOM.createRoot(document.getElementById('spark-demo')).render(e(DS.Sparkline, { data: [4, 6, 5, 9, 7, 11, 10, 14, 12, 16] }));
})(0);
</script>
</body>
</html>
